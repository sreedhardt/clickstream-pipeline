# Kubernetes Job that submits the PyFlink analytics job to the session cluster.
# Re-run this whenever you want to (re-)submit the job.
#
# Usage:
#   kubectl delete job flink-job-submit -n streaming --ignore-not-found
#   kubectl apply  -f k8s/flink/flink-job-submit.yaml
#   kubectl logs   -n streaming -l job-name=flink-job-submit -f

apiVersion: batch/v1
kind: Job
metadata:
  name: flink-job-submit
  namespace: streaming
  labels:
    app: flink
    component: job-submit
spec:
  ttlSecondsAfterFinished: 300   # Auto-clean after 5 min
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Wait until the JobManager REST API is actually answering before submitting.
        # kubectl rollout status only checks pod readiness, not REST API health.
        - name: wait-for-jobmanager
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Flink JobManager REST API at flink-jobmanager:8081 ..."
              until wget -qO- http://flink-jobmanager:8081/overview >/dev/null 2>&1; do
                echo "  not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "JobManager is ready!"
      containers:
        - name: job-submit
          image: clickstream-flink:latest
          imagePullPolicy: Never
          # -m specifies the JobManager REST address for a standalone/session cluster.
          # --target remote / --jobmanager are Kubernetes-native mode flags and do NOT
          # work for plain standalone session clusters — they cause the Netty retry error.
          command:
            - /opt/flink/bin/flink
            - run
            - -m
            - flink-jobmanager:8081
            - --python
            - /opt/flink/jobs/analytics_job.py
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.streaming.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "clickstream-events"
            - name: POSTGRES_URL
              value: "jdbc:postgresql://streaming-postgresql.streaming.svc.cluster.local:5432/analytics"
            - name: POSTGRES_USER
              value: "analytics"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: WINDOW_MINUTES
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
